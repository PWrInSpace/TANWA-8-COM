syntax = "proto3";

message LoRaFrame {
    uint32 tanwa_state = 1;
    uint32 uptime = 2;
    int32 engine_work_time = 3;
    
    float pressure_fuel = 4;
    float pressure_N2 = 5;
    float pressure_droid = 6;
    float pressure_oxy = 7;

    float pressure_injector_fuel = 8;
    float pressure_injector_oxi = 9;
    float pressure_combustion_chamber = 10;

    optional bool status_fill_n2o = 11;
    optional bool status_depr_n2o = 12;
    optional bool status_vent_n2o = 13;
    optional bool status_arm = 14;
    optional bool igniter_cont1 = 15;
    optional bool igniter_cont2 = 16;
    
    float tanwa_battery = 17;
    
    float engine_thrust = 18;
    float rocket_weight = 19;
    float tank_weight = 20;

    float temp_injector = 21;
    float temp_combustion_chamber = 22;
    float temp_external_tank = 23;


    optional bool status_oxy = 24;
    optional bool status_fuel = 25;
    optional bool status_n2 = 26;
    optional bool status_qd_n2o = 27;
    optional bool status_fill_n2 = 28;
    optional bool status_depr_n2 = 29;
    optional bool status_qd_n2 = 30;
    optional bool status_vent_eth = 31;
    optional bool status_vent_n2 = 32;
    
    float pressure_cutoff = 33;

}

message LoRaCommand {
    //Command frame
    uint32 lora_dev_id = 1;
    uint32 sys_dev_id = 2;
    uint32 command = 3;
    int32 payload = 4;
}

message LoRaSettings{
    // Settings frame
    int32 lora_freq_khz = 1;
    int32 lora_transmit_ms = 2;
    int32 countdown_time = 3;
    int32 ingition_time = 4;
    uint32 flash_enable = 5;
    uint32 buzzer_enable = 6;
}
